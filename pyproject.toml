[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmqs"
version = "0.1.0"
description = "Prediction Market Quant Stack: execution-aware backtesting, paper trading, and honest edge validation for Kalshi and other prediction markets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PMQS contributors" }]
keywords = [
  "kalshi",
  "prediction-markets",
  "backtesting",
  "paper-trading",
  "event-contracts",
  "quant",
  "polymarket",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
capture = ["cryptography>=42"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/jhunter11/pmqs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
